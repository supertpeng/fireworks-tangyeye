<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 为唐叶叶放的烟花 ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; }
  canvas { display: block; width: 100%; height: 100%; }

  .title {
    position: fixed;
    top: 7%;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(34px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: 8px;
    z-index: 5;
    pointer-events: none;
  }

  /* 每个字轮流发光 */
  .title span {
    display: inline-block;
    background: linear-gradient(120deg, #ffd1e8, #ff5f8f, #ffd166, #7bf1ff, #ffd1e8);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: flow 4s ease-in-out infinite, bounce 3s ease-in-out infinite;
    text-shadow: none;
  }
  .title span:nth-child(1) { animation-delay: 0s, 0s; }
  .title span:nth-child(2) { animation-delay: .15s, .1s; }
  .title span:nth-child(3) { animation-delay: .3s, .2s; }
  .title span:nth-child(4) { animation-delay: .45s, .3s; }
  .title span:nth-child(5) { animation-delay: .6s, .4s; }
  .title span:nth-child(6) { animation-delay: .75s, .5s; }

  @keyframes flow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .subtitle {
    position: fixed;
    top: calc(7% + clamp(52px, 8vw, 92px));
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(14px, 2vw, 20px);
    color: rgba(255, 214, 232, .8);
    letter-spacing: 4px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 0 16px rgba(255, 120, 180, .5);
  }

  .hint {
    position: fixed;
    bottom: 5%;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: rgba(255, 255, 255, .45);
    letter-spacing: 2px;
    z-index: 5;
    pointer-events: none;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50% { opacity: .8; }
  }

  .msg-box {
    position: fixed;
    top: 58%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(20px, 3vw, 34px);
    font-weight: 600;
    color: #ffd9ec;
    letter-spacing: 4px;
    text-shadow: 0 0 24px rgba(255, 130, 190, .8);
    z-index: 6;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.9);
    transition: opacity 1s ease, transform 1s ease;
  }
  .msg-box.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="title">
  <span>致</span><span>唐</span><span>叶</span><span>叶</span><span>的</span><span>✨</span>
</div>
<div class="subtitle">今晚的烟花 只为你一人绽放 💗</div>
<div class="msg-box" id="msg"></div>
<div class="hint">点击屏幕任意位置，为叶叶放一朵专属烟花 ❤</div>

<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
const msgBox = document.getElementById('msg');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const MESSAGES = [
  '唐叶叶，遇见你是我最亮的烟花 🎆',
  '每一朵，都是想你的样子 💗',
  '叶叶笑起来，比烟花还好看 🌸',
  '和你在一起，每一天都在发光 ✨',
  '余生请多指教，我的叶叶 💕'
];

const PALETTES = [
  ['#ff5f7e', '#ffc2d1', '#ff2e63'],
  ['#ffd166', '#ffefb5', '#ff9f1c'],
  ['#7bf1ff', '#d0fbff', '#3aa9ff'],
  ['#c084fc', '#f0c8ff', '#9d5cff'],
  ['#7cffb2', '#e2fff0', '#2ee59d'],
  ['#fff1f1', '#ffd0e0', '#ff6b9a']
];

let particles = [];
let rockets = [];

function rand(a, b) { return a + Math.random() * (b - a); }

function explode(x, y, palette) {
  const pal = palette || PALETTES[Math.floor(Math.random() * PALETTES.length)];
  const type = Math.random();
  const count = Math.floor(rand(70, 120));

  // 外圈大爆炸
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + rand(-0.06, 0.06);
    const speed = rand(2.5, 7.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: rand(0.008, 0.02),
      color: pal[Math.floor(Math.random() * pal.length)],
      size: rand(1.5, 3.2)
    });
  }

  // 内圈金色亮心
  for (let i = 0; i < 30; i++) {
    const angle = rand(0, Math.PI * 2);
    const speed = rand(1, 3.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: rand(0.01, 0.025),
      color: '#fff3b0',
      size: rand(1, 2.2)
    });
  }

  if (type < 0.28) {
    // 心形烟花
    heartBurst(x, y, pal);
  } else if (type < 0.5) {
    // 金色垂柳（烟花下落的柳条效果）
    willowBurst(x, y, pal);
  } else if (type < 0.62) {
    // 双层爆炸：延迟一小圈二次绽放
    setTimeout(() => {
      explode2(x, y + rand(0, 40), pal);
    }, 320);
  } else if (type < 0.72) {
    // 闪烁星尘
    sparkleBurst(x, y, pal);
  }
}

// 二次绽放（纯爆炸，不递归）
function explode2(x, y, pal) {
  const count = 60;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count;
    const speed = rand(2, 5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: rand(0.008, 0.016),
      color: pal[2] || pal[0],
      size: rand(1.4, 2.8)
    });
  }
}

// 垂柳效果：粒子慢慢下垂、拖着长尾巴
function willowBurst(x, y, pal) {
  for (let i = 0; i < 80; i++) {
    const angle = (Math.PI * 2 * i) / 80;
    const speed = rand(4, 6.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: rand(0.005, 0.009),
      color: pal[1],
      size: rand(1.4, 2.6),
      gravity: 0.075,      // 更强的下坠感
      drag: 0.93,          // 更强的空气阻力
      trail: true
    });
  }
}

// 闪烁星尘：忽明忽暗
function sparkleBurst(x, y, pal) {
  for (let i = 0; i < 70; i++) {
    const angle = rand(0, Math.PI * 2);
    const speed = rand(1.5, 6);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: rand(0.006, 0.014),
      color: pal[Math.floor(Math.random() * pal.length)],
      size: rand(1.4, 3),
      twinkle: true
    });
  }
}

function heartBurst(x, y, pal) {
  const n = 60;
  for (let i = 0; i < n; i++) {
    const t = (Math.PI * 2 * i) / n;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    const s = 0.32;
    particles.push({
      x, y,
      vx: hx * s,
      vy: hy * s,
      life: 1,
      decay: rand(0.006, 0.011),
      color: pal[0],
      size: rand(2, 3.4),
      gravity: 0.018
    });
  }
}

function launch(tx, ty) {
  const sx = tx + rand(-30, 30);
  rockets.push({
    x: sx,
    y: H + 10,
    tx, ty,
    vy: rand(-11, -13.5),
    trail: [],
    color: PALETTES[Math.floor(Math.random() * PALETTES.length)][1]
  });
}

// 背景星空：常驻闪烁的小星星，让画面一直是活的
// ⚠️ 必须在 loop() 启动前定义，否则首帧报错导致整个动画引擎崩溃
const stars = [];
function initStars() {
  stars.length = 0;
  const count = Math.floor((W * H) / 9000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: rand(0.4, 1.4),
      phase: Math.random() * Math.PI * 2,
      speed: rand(0.5, 2)
    });
  }
}
initStars();
window.addEventListener('resize', initStars);

function drawStars(t) {
  ctx.globalCompositeOperation = 'source-over';
  for (const s of stars) {
    const a = 0.25 + 0.55 * Math.abs(Math.sin(t / 1000 * s.speed + s.phase));
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function loop(t) {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalCompositeOperation = 'source-over';

  // 常驻闪烁星空
  drawStars(t || 0);

  // 火箭
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.y += r.vy;
    r.trail.push({ x: r.x, y: r.y });
    if (r.trail.length > 12) r.trail.shift();

    for (let j = 0; j < r.trail.length; j++) {
      const t = r.trail[j];
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(t.x + 0.1, t.y + 0.1);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 2 * (j / r.trail.length);
      ctx.globalAlpha = j / r.trail.length;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (r.y <= r.ty) {
      explode(r.x, r.y);
      rockets.splice(i, 1);
    }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += (p.gravity !== undefined ? p.gravity : 0.04);
    p.vx *= (p.drag !== undefined ? p.drag : 0.985);
    p.vy *= (p.drag !== undefined ? p.drag : 0.985);
    p.life -= p.decay;

    // 闪烁效果
    let alpha = Math.max(p.life, 0);
    if (p.twinkle) alpha *= (0.45 + 0.55 * Math.abs(Math.sin(p.life * 22)));

    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * Math.max(p.life, 0), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;
    ctx.fill();

    // 垂柳拖尾
    if (p.trail) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 4, p.y - p.vy * 4);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size * p.life * 0.7;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
loop();

function autoLaunch() {
  // 每次放 1~3 朵，位置随机，保证天空中始终有烟花
  const n = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    setTimeout(() => launch(rand(W * 0.12, W * 0.88), rand(H * 0.10, H * 0.5)), i * 180);
  }
}

// 智能补位：烟花快放完时立刻补新的一波，永远不冷场
function keepAlive() {
  const active = rockets.length + particles.length;
  if (active < 300) {
    autoLaunch();
  }
  setTimeout(keepAlive, 500);
}
keepAlive();

let autoTimer = setInterval(autoLaunch, 1400);
setTimeout(autoLaunch, 200);

let msgIndex = -1;
let lastTapTime = 0;

// 点击交互：点击处立刻炸开一朵 + 再升空一朵，双重反馈
function handleTap(x, y) {
  // 防止 pointerdown 和 mousedown 重复触发
  const now = Date.now();
  if (now - lastTapTime < 300) return;
  lastTapTime = now;

  // 1. 点击位置瞬间绽放（立刻有效果）
  explode(x, y);
  // 2. 同时再从底部升空一朵，飞到上方绽放
  launch(x, y - rand(80, 160));
  // 3. 弹出情话
  msgIndex = (msgIndex + 1) % MESSAGES.length;
  msgBox.textContent = MESSAGES[msgIndex];
  msgBox.classList.add('show');
  clearTimeout(msgBox._t);
  msgBox._t = setTimeout(() => msgBox.classList.remove('show'), 3500);
}

// 监听整个窗口，兼容鼠标 / 触屏 / 各种浏览器
window.addEventListener('pointerdown', (e) => {
  handleTap(e.clientX, e.clientY);
}, { passive: true });

// 兼容不支持 pointerdown 的老浏览器 / 微信内置浏览器
window.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches.length > 0) {
    handleTap(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: true });

window.addEventListener('mousedown', (e) => {
  handleTap(e.clientX, e.clientY);
}, { passive: true });

setTimeout(() => {
  for (let i = 0; i < 6; i++) {
    setTimeout(autoLaunch, i * 200);
  }
}, 500);
</script>
</body>
</html>
