<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ 致唐叶叶 ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #1a0508 0%, #0d0205 70%, #080102 100%);
  }

  /* 背景漂浮的小爱心 */
  .bg-heart {
    position: fixed;
    bottom: -40px;
    color: rgba(255, 40, 70, .28);
    font-size: 20px;
    animation: floatUp linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: .7; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  /* 舞台：收缩到内容大小后用 translate 精确居中，
     不依赖 flex 溢出行为和视口高度，任何手机上都不会偏移 */
  .stage {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    z-index: 5;
  }

  /* 心跳光圈 */
  .pulse-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255, 40, 70, .45);
    animation: ring 1.6s ease-out infinite;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .pulse-ring.r2 { animation-delay: .8s; }
  @keyframes ring {
    0%   { width: 220px; height: 220px; opacity: .8; }
    100% { width: 520px; height: 520px; opacity: 0; }
  }

  /* 大爱心（SVG 绘制，立体光泽感；不用 min() 以兼容旧手机浏览器） */
  .heart {
    width: 200px;
    height: 200px;
    margin: 30px 0 16px;
    cursor: pointer;
    animation: beat 1.6s cubic-bezier(.4, 0, .2, 1) infinite;
    filter: drop-shadow(0 0 40px rgba(255, 30, 60, .75)) drop-shadow(0 0 90px rgba(255, 0, 40, .4));
    z-index: 6;
  }
  @media (max-width: 480px) {
    .heart { width: 44vw; height: 44vw; }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.18); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.12); }
    56%      { transform: scale(1); }
  }

  .heart:active { animation: none; transform: scale(1.3); transition: transform .15s; }

  /* 光圈位置对准爱心中心 */
  .pulse-ring {
    top: calc(50% - 118px);
    left: 50%;
  }

  /* 名字 */
  .name {
    margin-top: 26px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(34px, 6vw, 58px);
    font-weight: 800;
    color: #fff;
    letter-spacing: 10px;
    text-indent: 10px; /* 补偿最后一个字的字间距，保证视觉居中 */
    white-space: nowrap;
    text-shadow: 0 0 18px rgba(255, 60, 90, .9), 0 0 50px rgba(255, 0, 40, .5);
    z-index: 6;
    animation: nameGlow 2.4s ease-in-out infinite;
  }
  @keyframes nameGlow {
    0%, 100% { text-shadow: 0 0 18px rgba(255, 60, 90, .9), 0 0 50px rgba(255, 0, 40, .5); }
    50%      { text-shadow: 0 0 30px rgba(255, 90, 110, 1), 0 0 80px rgba(255, 0, 40, .7); }
  }

  .sub {
    margin-top: 14px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(14px, 2vw, 19px);
    color: rgba(255, 190, 200, .75);
    letter-spacing: 4px;
    z-index: 6;
  }

  .hint {
    position: fixed;
    bottom: 4%;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: rgba(255, 170, 185, .5);
    letter-spacing: 2px;
    z-index: 6;
    animation: hintPulse 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: .4; }
    50%      { opacity: .85; }
  }

  /* 点击弹出的小爱心 */
  .pop-heart {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    font-size: 26px;
    animation: pop 1.1s ease-out forwards;
  }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    70%  { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot)); opacity: 0; }
  }

  /* 心跳文字（随爱心一起出现） */
  .beat-word {
    position: fixed;
    top: 14%;
    width: 100%;
    text-align: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(13px, 1.8vw, 17px);
    color: rgba(255, 120, 140, .55);
    letter-spacing: 6px;
    z-index: 6;
    animation: wordBeat 1.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes wordBeat {
    0%, 100% { transform: scale(1); opacity: .5; }
    14%      { transform: scale(1.15); opacity: 1; }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.08); }
    56%      { transform: scale(1); }
  }

  /* 小屏手机适配：压缩尺寸，防止内容超出屏幕导致偏移 */
  @media (max-height: 640px) {
    .heart {
      width: min(140px, 40vw);
      height: min(140px, 40vw);
      margin: 14px 0 8px;
    }
    .name { margin-top: 14px; font-size: clamp(28px, 6vw, 42px); }
    .sub  { margin-top: 8px; font-size: clamp(12px, 2vw, 15px); }
    .pulse-ring { top: calc(50% - 86px); }
  }
</style>
</head>
<body>

<div class="beat-word">– 我的心跳 就是为你的节奏 –</div>

<div class="pulse-ring"></div>
<div class="pulse-ring r2"></div>

<div class="stage">
  <svg class="heart" id="bigHeart" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="heartGrad" cx="35%" cy="26%" r="90%">
        <stop offset="0%" stop-color="#ff7494"/>
        <stop offset="40%" stop-color="#ef1e44"/>
        <stop offset="100%" stop-color="#8c001e"/>
      </radialGradient>
      <linearGradient id="innerLight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(255,120,145,.55)"/>
        <stop offset="60%" stop-color="rgba(255,60,90,0)"/>
      </linearGradient>
      <radialGradient id="specGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="rgba(255,255,255,.85)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
    </defs>
    <!-- 心形主体 -->
    <path fill="url(#heartGrad)"
      d="M50 88
         C 24 68, 6 48, 6 29
         C 6 13, 18 4, 31 4
         C 41 4, 48 11, 50 18
         C 52 11, 59 4, 69 4
         C 82 4, 94 13, 94 29
         C 94 48, 76 68, 50 88 Z"/>
    <!-- 上方内透光，制造鼓起的感觉 -->
    <path fill="url(#innerLight)"
      d="M50 74
         C 30 58, 14 42, 14 28
         C 14 16, 23 10, 32 10
         C 41 10, 48 16, 50 22
         C 52 16, 59 10, 68 10
         C 77 10, 86 16, 86 28
         C 86 42, 70 58, 50 74 Z"/>
    <!-- 高光 -->
    <ellipse cx="29" cy="24" rx="14" ry="10" fill="url(#specGrad)" transform="rotate(-28 29 24)"/>
    <ellipse cx="68" cy="18" rx="6" ry="4" fill="rgba(255,255,255,.4)" transform="rotate(-15 68 18)"/>
    <!-- 边缘细描边增加轮廓感 -->
    <path fill="none" stroke="rgba(255,150,170,.35)" stroke-width="1"
      d="M50 88
         C 24 68, 6 48, 6 29
         C 6 13, 18 4, 31 4
         C 41 4, 48 11, 50 18
         C 52 11, 59 4, 69 4
         C 82 4, 94 13, 94 29
         C 94 48, 76 68, 50 88 Z"/>
  </svg>
  <div class="name">唐叶叶</div>
  <div class="sub">这颗心只为你跳动 ❤</div>
</div>

<div class="hint">点一下这颗爱心，会掉落好多小心心哦</div>

<script>
// 背景漂浮的小爱心
const EMOJIS = ['❤️', '💗', '💖', '💔', '🌹', '✨'];
function spawnBgHeart() {
  const el = document.createElement('div');
  el.className = 'bg-heart';
  el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  el.style.left = Math.random() * 100 + 'vw';
  el.style.fontSize = (12 + Math.random() * 22) + 'px';
  el.style.animationDuration = (5 + Math.random() * 6) + 's';
  el.style.opacity = 0.3 + Math.random() * 0.5;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 12000);
}
setInterval(spawnBgHeart, 700);
for (let i = 0; i < 8; i++) setTimeout(spawnBgHeart, i * 400);

// 点击弹出小心心
let lastTap = 0;
function handleTap(x, y) {
  const now = Date.now();
  if (now - lastTap < 250) return;
  lastTap = now;
  const n = 10 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'pop-heart';
    el.textContent = ['❤️', '💗', '💖'][Math.floor(Math.random() * 3)];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
    el.style.setProperty('--dy', (Math.random() * -260 - 60) + 'px');
    el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
    el.style.fontSize = (16 + Math.random() * 22) + 'px';
    el.style.animationDelay = (Math.random() * 0.25) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }
}
window.addEventListener('pointerdown', (e) => handleTap(e.clientX, e.clientY), { passive: true });
window.addEventListener('touchstart', (e) => {
  if (e.touches && e.touches.length) handleTap(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('mousedown', (e) => handleTap(e.clientX, e.clientY), { passive: true });
</script>
</body>
</html>
